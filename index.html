<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adsterra Cash</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ফায়ারবেস কনফিগ
    const firebaseConfig = {
      apiKey: "AIzaSyD49kRBDJgubSBGr5Ta8bFLHnoAvNMNyRQ",
      authDomain: "new-app-b5eb0.firebaseapp.com",
      projectId: "new-app-b5eb0",
      storageBucket: "new-app-b5eb0.firebasestorage.app",
      messagingSenderId: "912055526667",
      appId: "1:912055526667:web:07195303345b15ada3ae0e"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // আইকনস
    const IconMenu = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="14" y1="18" y2="18"/></svg>;
    const IconBell = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>;
    
    const IconMouse = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 11a3 3 0 1 0 6 0 3 3 0 0 0-6 0"/><path d="M17.657 16.657L13.414 20.9a2 2 0 0 1-2.827 0l-4.244-4.243a8 8 0 1 1 11.314 0z"/></svg>;
    const IconWallet = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>;
    const IconPlay = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>;
    const IconDashboard = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>;
    const IconHistory = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>;
    const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconAlert = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
    const IconClock = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const IconLogOut = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>;
    const IconLoader = ({ className }) => <svg className={`animate-spin ${className}`} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" x2="12" y1="2" y2="6"/><line x1="12" x2="12" y1="18" y2="22"/><line x1="4.93" x2="7.76" y1="4.93" y2="7.76"/><line x1="16.24" x2="19.07" y1="16.24" y2="19.07"/><line x1="2" x2="6" y1="12" y2="12"/><line x1="18" x2="22" y1="12" y2="12"/><line x1="4.93" x2="7.76" y1="19.07" y2="16.24"/><line x1="16.24" x2="19.07" y1="7.76" y2="4.93"/></svg>;

    function App() {
      const [user, setUser] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);
      const [authError, setAuthError] = useState('');
      const [isAuthProcessing, setIsAuthProcessing] = useState(false);
      
      const [nameInput, setNameInput] = useState('');

      const [userData, setUserData] = useState({ balance: 0, totalClicks: 0, viewedAds: [], name: '' });
      const [withdrawals, setWithdrawals] = useState([]);
      
      // নতুন: প্রোফাইল ট্যাব যুক্ত করা হয়েছে
      const [activeTab, setActiveTab] = useState('dashboard');
      const [activeAd, setActiveAd] = useState(null);
      const [timeLeft, setTimeLeft] = useState(0);
      const [message, setMessage] = useState('');
      
      const [bkashNumber, setBkashNumber] = useState('');
      const [withdrawAmount, setWithdrawAmount] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);

      const allAds = [
        { id: 'ad_1', title: 'Adsterra Direct Link 1', reward: 2.00, duration: 20, link: 'https://www.profitableratecpmnetwork.com/syp87vwp?key=f6f33d081102bce4009209a211ad25dc' },
        { id: 'ad_2', title: 'Adsterra Direct Link 2', reward: 1.50, duration: 15, link: 'https://www.profitableratecpmnetwork.com/syp87vwp?key=f6f33d081102bce4009209a211ad25dc' },
        { id: 'ad_3', title: 'Adsterra Premium Task', reward: 3.50, duration: 30, link: 'https://www.profitableratecpmnetwork.com/syp87vwp?key=f6f33d081102bce4009209a211ad25dc' },
        { id: 'ad_4', title: 'Adsterra Bonus Task', reward: 1.00, duration: 10, link: 'https://www.profitableratecpmnetwork.com/syp87vwp?key=f6f33d081102bce4009209a211ad25dc' },
      ];

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setLoadingAuth(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;

        const unsubUser = db.collection('users').doc(user.uid).onSnapshot((docSnap) => {
          if (docSnap.exists) {
            setUserData(docSnap.data());
          }
        });

        const unsubWithdrawals = db.collection('users').doc(user.uid).collection('withdrawals')
          .onSnapshot((snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a, b) => b.timestamp - a.timestamp);
            setWithdrawals(data);
          });

        return () => { unsubUser(); unsubWithdrawals(); }
      }, [user]);

      useEffect(() => {
        if (message) {
          const timer = setTimeout(() => setMessage(''), 4000);
          return () => clearTimeout(timer);
        }
      }, [message]);

      useEffect(() => {
        let timer;
        if (activeAd && timeLeft > 0) {
          timer = setTimeout(() => setTimeLeft(timeLeft - 1), 1000);
        } else if (activeAd && timeLeft === 0) {
          handleAdComplete();
        }
        return () => clearTimeout(timer);
      }, [activeAd, timeLeft]);

      const handleNameLogin = async (e) => {
        e.preventDefault();
        if(!nameInput.trim()) return setAuthError('দয়া করে আপনার নাম লিখুন।');
        setAuthError('');
        setIsAuthProcessing(true);
        try {
          const result = await auth.signInAnonymously();
          await db.collection('users').doc(result.user.uid).set({
            name: nameInput,
            balance: 0,
            totalClicks: 0,
            viewedAds: []
          }, { merge: true });
        } catch (error) {
          setAuthError('লগইন করতে সমস্যা হয়েছে।');
        }
        setIsAuthProcessing(false);
      };

      const handleGoogleLink = async () => {
        setIsAuthProcessing(true);
        try {
          await user.linkWithPopup(googleProvider);
          setMessage("অভিনন্দন! আপনার অ্যাকাউন্ট সফলভাবে ভেরিফাই হয়েছে।");
          await db.collection('users').doc(user.uid).set({
            email: auth.currentUser.email
          }, { merge: true });
        } catch (error) {
          if (error.code === 'auth/credential-already-in-use') {
             setMessage('এই জিমেইলটি অন্য অ্যাকাউন্টে ব্যবহৃত হচ্ছে।');
          } else {
             setMessage('ভেরিফিকেশন বাতিল হয়েছে।');
          }
        }
        setIsAuthProcessing(false);
      };

      const handleLogout = () => auth.signOut();

      const handleAdClick = (ad) => {
        if (userData.viewedAds?.includes(ad.id)) return;
        setActiveAd(ad);
        setTimeLeft(ad.duration);
        window.open(ad.link, '_blank');
      };

      const handleAdComplete = async () => {
        if (!user) return;
        const currentBalance = userData.balance || 0;
        const currentClicks = userData.totalClicks || 0;
        const currentViewedAds = userData.viewedAds || [];

        await db.collection('users').doc(user.uid).set({
          balance: currentBalance + activeAd.reward,
          totalClicks: currentClicks + 1,
          viewedAds: [...currentViewedAds, activeAd.id]
        }, { merge: true });

        setMessage(`সফল হয়েছে! ৳${activeAd.reward.toFixed(2)} যোগ করা হয়েছে।`);
        setActiveAd(null);
      };

      const handleWithdraw = async (e) => {
        e.preventDefault();
        const amount = parseFloat(withdrawAmount);
        const currentBalance = userData.balance || 0;
        
        if (amount < 50) return setMessage('সর্বনিম্ন উইথড্র ৳50');
        if (amount > currentBalance) return setMessage('পর্যাপ্ত ব্যালেন্স নেই!');
        if (bkashNumber.length !== 11) return setMessage('সঠিক ১১ ডিজিটের নাম্বার দিন।');

        setIsProcessing(true);
        try {
          await db.collection('users').doc(user.uid).set({ balance: currentBalance - amount }, { merge: true });
          await db.collection('users').doc(user.uid).collection('withdrawals').add({
            amount: amount, number: bkashNumber, status: 'Pending',
            timestamp: Date.now(), date: new Date().toLocaleDateString('bn-BD')
          });
          setBkashNumber(''); setWithdrawAmount('');
          setMessage(`উইথড্র রিকোয়েস্ট সাবমিট হয়েছে!`);
          setActiveTab('dashboard');
        } catch (error) {
          setMessage('সমস্যা হয়েছে। আবার চেষ্টা করুন।');
        }
        setIsProcessing(false);
      };

      if (loadingAuth) {
        return <div className="min-h-screen flex items-center justify-center bg-gray-50"><IconLoader className="text-indigo-600 w-8 h-8" /></div>;
      }

      if (!user) {
        return (
          <div className="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
            <div className="sm:mx-auto sm:w-full sm:max-w-md text-center">
              <div className="inline-flex p-4 bg-indigo-600 rounded-full mb-4 shadow-lg text-yellow-400">
                <IconMouse />
              </div>
              <h2 className="text-3xl font-extrabold text-gray-900">Adsterra <span className="font-light text-indigo-600">Cash</span></h2>
              <p className="mt-2 text-sm text-gray-600">বিজ্ঞাপন দেখুন, প্রতিদিন আয় করুন</p>
            </div>
            
            <div className="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
              <div className="bg-white py-8 px-4 shadow sm:rounded-2xl sm:px-10 border border-gray-100">
                <h3 className="text-xl font-bold text-gray-800 mb-6 text-center">শুরু করতে আপনার নাম লিখুন</h3>
                {authError && <div className="mb-4 bg-red-50 border-l-4 border-red-500 text-red-700 p-3 text-sm rounded flex items-center gap-2"><IconAlert /> {authError}</div>}
                <form onSubmit={handleNameLogin} className="space-y-5">
                  <input type="text" required value={nameInput} onChange={(e) => setNameInput(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-center font-medium" placeholder="আপনার নাম লিখুন..." />
                  <button type="submit" disabled={isAuthProcessing} className="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-lg shadow-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400">
                    {isAuthProcessing ? <IconLoader/> : 'প্রবেশ করুন'}
                  </button>
                </form>
              </div>
            </div>
          </div>
        );
      }

      const currentBalance = userData.balance || 0;
      const currentClicks = userData.totalClicks || 0;
      const isAnonymous = user.isAnonymous;
      const displayName = userData.name || user.displayName || 'ব্যবহারকারী';
      const initialLetter = displayName.charAt(0).toUpperCase();

      return (
        <div className="pb-10">
          
          {/* নতুন টপ নেভিগেশন (আপনার ছবির মতো ডিজাইন) */}
          <nav className="bg-[#0f172a] text-white pt-6 pb-5 px-4 shadow-lg sticky top-0 z-40">
            <div className="max-w-4xl mx-auto flex justify-between items-center">
              
              {/* বামপাশের অংশ: হ্যামবার্গার মেনু এবং নাম */}
              <div className="flex items-center gap-4">
                <button className="text-white hover:text-gray-300 transition-colors">
                  <IconMenu />
                </button>
                <div className="flex flex-col">
                  <h1 className="text-xl md:text-2xl font-bold tracking-wide truncate w-40 sm:w-auto">
                    Hi, {displayName}
                  </h1>
                  <p className="text-xs text-gray-400 font-medium tracking-wider">Explore the dashboard</p>
                </div>
              </div>

              {/* ডানপাশের অংশ: নোটিফিকেশন এবং প্রোফাইল ছবি */}
              <div className="flex items-center gap-5">
                <div className="relative cursor-pointer text-gray-200 hover:text-white transition-colors">
                  <IconBell />
                  <span className="absolute top-0 right-0 w-2.5 h-2.5 bg-yellow-400 border-2 border-[#0f172a] rounded-full"></span>
                </div>
                
                {/* প্রোফাইল ছবিতে ক্লিক করলে "profile" ট্যাব ওপেন হবে */}
                <button 
                  onClick={() => setActiveTab('profile')} 
                  className="w-12 h-12 rounded-full overflow-hidden border-2 border-transparent hover:border-white focus:border-white transition-all shadow-md focus:outline-none"
                >
                  {user.photoURL ? (
                    <img src={user.photoURL} alt="Profile" className="w-full h-full object-cover" />
                  ) : (
                    <div className="w-full h-full bg-orange-500 flex items-center justify-center text-white text-xl font-bold">
                      {initialLetter}
                    </div>
                  )}
                </button>
              </div>

            </div>
          </nav>

          <main className="max-w-4xl mx-auto p-4 py-6">
            {message && (
              <div className="mb-6 bg-indigo-50 border-l-4 border-indigo-500 text-indigo-700 p-4 flex items-center gap-3 animate-pulse rounded shadow-sm">
                <IconCheck /> <p className="font-medium text-sm">{message}</p>
              </div>
            )}

            {/* মেইন ট্যাব মেনু */}
            <div className="flex bg-white rounded-xl shadow-sm mb-6 p-1 border border-gray-100 overflow-x-auto">
              <button onClick={() => setActiveTab('dashboard')} className={`flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-lg font-medium text-sm whitespace-nowrap transition-colors ${activeTab === 'dashboard' ? 'bg-[#0f172a] text-white' : 'text-gray-500 hover:bg-gray-50'}`}><IconDashboard/> ড্যাশবোর্ড</button>
              <button onClick={() => setActiveTab('ads')} className={`flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-lg font-medium text-sm whitespace-nowrap transition-colors ${activeTab === 'ads' ? 'bg-[#0f172a] text-white' : 'text-gray-500 hover:bg-gray-50'}`}><IconPlay/> কাজ করুন</button>
              <button onClick={() => setActiveTab('withdraw')} className={`flex-1 flex items-center justify-center gap-2 py-3 px-4 rounded-lg font-medium text-sm whitespace-nowrap transition-colors ${activeTab === 'withdraw' ? 'bg-[#e2136e]/10 text-[#e2136e]' : 'text-gray-500 hover:bg-gray-50'}`}><IconWallet/> উইথড্র</button>
            </div>

            {/* =========================================================
                নতুন প্রোফাইল ট্যাব (যেটি ছবিতে ক্লিক করলে ওপেন হবে)
                ========================================================= */}
            {activeTab === 'profile' && (
              <div className="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8 animate-fade-in">
                <h2 className="text-2xl font-bold text-gray-800 mb-8 text-center border-b pb-4">আপনার প্রোফাইল</h2>
                
                <div className="flex flex-col items-center mb-8">
                   <div className="w-24 h-24 rounded-full overflow-hidden border-4 border-indigo-50 shadow-md mb-4">
                     {user.photoURL ? (
                       <img src={user.photoURL} alt="Profile" className="w-full h-full object-cover" />
                     ) : (
                       <div className="w-full h-full bg-orange-500 flex items-center justify-center text-white text-4xl font-bold">
                         {initialLetter}
                       </div>
                     )}
                   </div>
                   <h3 className="text-xl font-bold text-gray-800">{displayName}</h3>
                   <p className="text-sm text-gray-500 mt-1">{user.email || 'ইমেইল অ্যাড করা নেই'}</p>
                </div>

                <div className="space-y-4">
                   {isAnonymous ? (
                     <div className="bg-yellow-50 p-5 rounded-xl border border-yellow-200 text-center">
                        <div className="inline-flex p-2 bg-yellow-100 text-yellow-600 rounded-full mb-2"><IconAlert /></div>
                        <h4 className="font-bold text-gray-800 mb-2">অ্যাকাউন্ট ভেরিফাই করুন</h4>
                        <p className="text-xs text-gray-600 mb-4">আপনার জমানো ব্যালেন্স সুরক্ষিত রাখতে এবং টাকা উইথড্র করতে গুগল অ্যাকাউন্ট লিঙ্ক করুন।</p>
                        <button onClick={handleGoogleLink} disabled={isAuthProcessing} className="w-full bg-white border border-gray-300 text-gray-700 font-bold py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 hover:bg-gray-50 transition-colors shadow-sm text-sm">
                          {isAuthProcessing ? <IconLoader className="text-indigo-600"/> : (
                            <>
                              <svg className="w-4 h-4" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                              Google দিয়ে ভেরিফাই করুন
                            </>
                          )}
                        </button>
                     </div>
                   ) : (
                     <div className="bg-green-50 p-4 rounded-xl border border-green-200 flex items-center justify-center gap-2 text-green-700 font-bold">
                        <IconCheck /> অ্যাকাউন্ট ভেরিফাইড
                     </div>
                   )}

                   <button onClick={handleLogout} className="w-full bg-red-50 text-red-600 font-bold py-3.5 rounded-xl hover:bg-red-100 flex justify-center items-center gap-2 transition-colors border border-red-100">
                     <IconLogOut /> অ্যাকাউন্ট থেকে লগআউট করুন
                   </button>
                </div>
              </div>
            )}

            {/* Dashboard Content */}
            {activeTab === 'dashboard' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-gradient-to-br from-indigo-500 to-indigo-700 p-6 rounded-2xl shadow-md text-white">
                  <p className="text-sm font-medium mb-1">বর্তমান ব্যালেন্স</p>
                  <h2 className="text-4xl font-bold mb-4">৳ {currentBalance.toFixed(2)}</h2>
                  <button onClick={() => setActiveTab('withdraw')} className="bg-white/20 px-4 py-2 rounded-lg text-sm font-medium hover:bg-white/30 transition-colors">উইথড্র করুন</button>
                </div>
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                  <p className="text-gray-500 text-sm font-medium mb-1">মোট কাজ সম্পন্ন করেছেন</p>
                  <h2 className="text-4xl font-bold text-gray-800">{currentClicks} <span className="text-lg text-gray-400">টি</span></h2>
                  
                  {isAnonymous ? (
                    <div className="mt-4 text-xs bg-yellow-50 text-yellow-700 p-2 rounded flex items-center justify-between border border-yellow-100">
                      <span>অ্যাকাউন্ট ভেরিফাইড নয়!</span>
                      <button onClick={()=>setActiveTab('profile')} className="underline font-bold">ভেরিফাই করুন</button>
                    </div>
                  ) : (
                    <div className="mt-4 text-xs bg-green-50 text-green-700 p-2 rounded flex items-center gap-1 border border-green-100">
                      <IconCheck/> <span>আপনার অ্যাকাউন্ট সুরক্ষিত আছে।</span>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* Ads Content */}
            {activeTab === 'ads' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {allAds.map(ad => {
                  const isViewed = (userData.viewedAds || []).includes(ad.id);
                  return (
                  <div key={ad.id} className={`bg-white p-5 rounded-xl border ${isViewed ? 'border-gray-200 opacity-60' : 'border-indigo-100 shadow-sm'}`}>
                    <div className="flex justify-between mb-3">
                      <h3 className="font-semibold text-gray-800">{ad.title}</h3>
                      <span className="text-sm font-bold text-green-700 bg-green-100 px-3 py-1 rounded-full">৳ {ad.reward.toFixed(2)}</span>
                    </div>
                    <div className="text-gray-500 text-sm mb-4 flex items-center gap-1"><IconClock/> {ad.duration} সেকেন্ড অপেক্ষা</div>
                    <button onClick={() => handleAdClick(ad)} disabled={isViewed || activeAd !== null} className={`w-full py-2.5 rounded-lg font-bold transition-colors ${isViewed ? 'bg-gray-100 text-gray-400' : activeAd !== null ? 'bg-indigo-300 text-white' : 'bg-[#0f172a] text-white hover:bg-indigo-900'}`}>
                      {isViewed ? 'সম্পন্ন হয়েছে' : 'কাজ শুরু করুন'}
                    </button>
                  </div>
                )})}
              </div>
            )}

            {/* Withdraw Content */}
            {activeTab === 'withdraw' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <div className="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 p-6 relative overflow-hidden">
                  <h2 className="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2"><span className="text-[#e2136e]"><IconWallet/></span> বিকাশে পেমেন্ট নিন</h2>
                  
                  {isAnonymous ? (
                    <div className="bg-yellow-50 p-6 rounded-xl border border-yellow-200 text-center mt-4">
                      <div className="inline-flex p-3 bg-yellow-100 text-yellow-600 rounded-full mb-3"><IconAlert /></div>
                      <h3 className="text-lg font-bold text-gray-800 mb-2">অ্যাকাউন্ট ভেরিফাই করুন</h3>
                      <p className="text-sm text-gray-600 mb-5">টাকা উইথড্র করার জন্য আপনার অ্যাকাউন্টটি ভেরিফাই করা বাধ্যতামূলক।</p>
                      <button onClick={()=>setActiveTab('profile')} className="bg-[#0f172a] text-white font-bold py-2.5 px-6 rounded-lg hover:bg-gray-800 transition-colors shadow-sm">
                        প্রোফাইল পেজে যান
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleWithdraw} className="space-y-4">
                      <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-1">টাকার পরিমাণ</label>
                        <input type="number" required min="50" value={withdrawAmount} onChange={(e) => setWithdrawAmount(e.target.value)} placeholder="সর্বনিম্ন 50 টাকা" className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#e2136e] outline-none" />
                      </div>
                      <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-1">বিকাশ নাম্বার</label>
                        <input type="tel" required maxLength="11" value={bkashNumber} onChange={(e) => setBkashNumber(e.target.value)} placeholder="01XXXXXXXXX" className="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#e2136e] outline-none" />
                      </div>
                      <button type="submit" disabled={isProcessing} className="w-full bg-[#e2136e] text-white font-bold py-3.5 rounded-xl hover:bg-[#c90f5f] flex justify-center mt-2 transition-colors">
                        {isProcessing ? <IconLoader/> : 'রিকোয়েস্ট পাঠান'}
                      </button>
                    </form>
                  )}
                </div>

                <div className="lg:col-span-1 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                  <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2"><span className="text-gray-500"><IconHistory/></span> হিস্ট্রি</h3>
                  {withdrawals.length === 0 ? <p className="text-sm text-gray-400">কোনো হিস্ট্রি নেই</p> : (
                    <div className="space-y-3">
                      {withdrawals.map(req => (
                        <div key={req.id} className="border-b border-gray-50 pb-2 text-sm">
                          <div className="flex justify-between mb-1"><span className="font-semibold">৳{req.amount}</span><span className="text-xs bg-yellow-100 text-yellow-700 px-2 rounded">{req.status}</span></div>
                          <div className="text-gray-500 text-xs">{req.number} • {req.date}</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* Ad Modal (Timer) */}
          {activeAd && (
            <div className="fixed inset-0 bg-gray-900/95 flex flex-col z-50">
              <div className="bg-[#0f172a] text-white p-3 flex justify-between items-center shadow-md">
                <div className="flex items-center gap-3">
                  <span className="font-bold border-2 border-white rounded-full w-10 h-10 flex justify-center items-center">{timeLeft}s</span>
                  <span className="font-semibold text-sm">অপেক্ষা করুন...</span>
                </div>
                <button onClick={() => { setActiveAd(null); setTimeLeft(0); }} className="bg-red-500 hover:bg-red-600 px-4 py-1.5 rounded-lg text-sm transition-colors">বাতিল</button>
              </div>
              <div className="flex-1 flex flex-col items-center justify-center p-4">
                 <div className="text-white text-center mb-6">
                   <h2 className="text-3xl font-bold mb-4">Adsterra Advertisement</h2>
                   <p className="text-gray-300 text-sm max-w-md mx-auto">
                     নতুন ট্যাবে ওপেন হওয়া বিজ্ঞাপনটি দয়া করে ভিজিট করুন। এই পেজটি বন্ধ করবেন না, টাইমার শেষ হলে আপনার অ্যাকাউন্টে টাকা যোগ হবে।
                   </p>
                 </div>
                 
                 <div className="w-32 h-32 rounded-full border-4 border-indigo-500 flex flex-col items-center justify-center bg-gray-800 shadow-[0_0_15px_rgba(99,102,241,0.5)] relative">
                    <span className="text-4xl font-bold text-white">{timeLeft}</span>
                    <span className="text-xs text-indigo-300 font-medium">সেকেন্ড</span>
                 </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

এখন আপনার ওয়েবসাইট দেখতে আগের থেকে অনেক বেশি প্রফেশনাল এবং সুন্দর লাগবে! ছবির ডানপাশে থাকা ইউজার আইকনে (বা ছবিতে) ক্লিক করে একবার চেক করে দেখুন প্রোফাইল পেজটি কেমন দেখাচ্ছে।
